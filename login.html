<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gemeinde-App – Anmeldung</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Unsere Gemeinde</h1>
  </header>

  <main>
    <h2>Anmelden</h2>
    <form id="login-form">
      <label for="email">E-Mail</label>
      <input type="email" id="email" required autocomplete="email">

      <label for="passwort">Passwort (mindestens 6 Zeichen)</label>
      <input type="password" id="passwort" required minlength="6" autocomplete="current-password">

      <button type="submit">Anmelden</button>
      <button type="button" id="registrieren" class="zweit">Neu registrieren</button>
      <p id="meldung"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="app.js"></script>
</body>
</html>
